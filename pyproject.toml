[project]
name = "codex-cli-proxy"
version = "0.0.1"
description = "Local OpenAI and Anthropic-compatible chat proxy backed by the Codex CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/rahgadda/codex-cli-proxy"
Repository = "https://github.com/rahgadda/codex-cli-proxy"

[project.scripts]
codex-cli-proxy = "codex_proxy_cli.app:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["codex_proxy"]
package-dir = { codex_proxy = "codex-proxy" }
